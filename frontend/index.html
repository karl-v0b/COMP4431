<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>COMP4431 AI Tutor</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app">
      
      <header class="header" style="display: flex; align-items: center; gap: 20px; margin-bottom: 20px; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 20px;">
          <div id="avatar-fallback" style="display: flex; width: 100px; height: 100px; background: #e0e7ff; border-radius: 50%; border: 4px solid #4f46e5; font-size: 3rem; transition: all 0.3s; align-items: center; justify-content: center;">🤖</div>
          <div>
            <h1 style="margin: 0;">COMP4431 AI Tutor</h1>
            <p id="status" class="status" hidden style="margin: 0;"></p>
          </div>
        </div>
        
        <div style="display: flex; gap: 10px;">
          <!-- NEW: Break Reminder Button -->
          <button id="break-btn" style="padding: 10px 20px; background: #f59e0b; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">☕ Remind Me</button>
          <button id="open-quiz-btn" style="padding: 10px 20px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">📝 Generate Quiz</button>
        </div>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <div class="settings-bar" style="margin: 10px 0; display: flex; gap: 20px; align-items: center; padding: 10px; background: #f8f9fa; border-radius: 8px;">
        <div>
          <label for="language-select" style="font-weight: bold; font-size: 14px;">Language:</label>
          <select id="language-select" style="padding: 5px; border-radius: 4px; border: 1px solid #ccc;">
            <option value="English">English</option>
            <option value="Traditional Chinese">中文 (Traditional Chinese)</option>
          </select>
        </div>
        <div>
          <label for="learning-mode" style="font-weight: bold; font-size: 14px;">Mode:</label>
          <select id="learning-mode" style="padding: 5px; border-radius: 4px; border: 1px solid #ccc;">
            <option value="Standard">Standard</option>
            <option value="ELI5">ELI5 (Explain Like I'm 5)</option>
            <option value="Deep Dive">Deep Dive (Technical)</option>
            <option value="Exam Prep">Exam Prep</option>
          </select>
        </div>
        <button id="mute-btn" type="button" style="margin-left: auto; padding: 6px 12px; cursor: pointer; border: 1px solid #ccc; background: white; border-radius: 4px; font-weight: bold;">🔊 Audio ON</button>
      </div>

      <form id="chat-form" class="composer">
        <textarea id="input" rows="2" placeholder="Ask any question about AI, Neural Networks, or Algorithms..." required></textarea>
        <button id="send" type="submit">Send</button>
      </form>

    </main>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Quiz Modal -->
    <div id="quiz-modal" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-header">
          <h3 style="margin: 0;">📝 Generate a Quiz</h3>
          <button id="close-quiz-btn" class="close-btn">&times;</button>
        </div>
        
        <div class="quiz-controls">
          <input type="text" id="quiz-topic" placeholder="Topic (e.g., Networking)" />
          <select id="quiz-scope">
            <option value="Big Picture">Big Picture</option>
            <option value="In-Depth">In-Depth</option>
            <option value="Very Specific">Very Specific</option>
          </select>
          <select id="quiz-language">
            <option value="English">English</option>
            <option value="Traditional Chinese">中文 (Traditional)</option>
          </select>
          <button id="quiz-btn" type="button">Generate</button>
        </div>
        
        <div id="quiz-result" class="quiz-result"></div>
      </div>
    </div>

    <script src="/static/marked.min.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
