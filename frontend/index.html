<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Tutor</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>AI Tutor</h1>
        <p id="status" class="status" hidden></p>
      </header>

      <nav class="mode-switch" aria-label="Tutor mode">
        <button id="chat-mode" type="button" aria-pressed="true">Chat</button>
        <button id="quiz-mode" type="button" aria-pressed="false">Quiz</button>
      </nav>
      <section id="quiz-panel" hidden aria-label="Lecture quiz">
        <h2>Test your understanding</h2>
        <p>Upload lecture PDFs below, then choose a topic. Questions use retrieved passages, not the entire course.</p>
        <form id="quiz-settings">
          <label>Topic <input id="quiz-topic" required maxlength="200" placeholder="e.g. breadth-first search"></label>
          <div class="quiz-controls">
            <label>Questions <select id="quiz-count"><option>1</option><option selected>3</option><option>5</option></select></label>
            <label>Difficulty <select id="quiz-difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></label>
            <label>Language <select id="quiz-language"><option>English</option><option>Traditional Chinese</option></select></label>
          </div>
          <button type="submit">Generate quiz</button>
        </form>
        <p id="quiz-status" role="status" aria-live="polite"></p>
        <form id="quiz-answers" hidden></form>
        <p class="quiz-note">AI-generated questions and answer keys can contain mistakes. Review the supporting passages. Quizzes expire after one hour or a server restart.</p>
      </section>
      <section id="messages" class="messages" aria-live="polite"></section>

      <section class="docs" aria-label="PDF references">
        <div class="docs-row">
          <label class="upload-label">
            Upload PDF
            <input id="pdf-input" type="file" accept="application/pdf,.pdf" hidden />
          </label>
          <button id="clear-docs" type="button">Clear PDF</button>
        </div>
        <p id="ingest-status" class="ingest-status"></p>
        <ul id="doc-list" class="doc-list"></ul>
      </section>

      <form id="chat-form" class="composer">
        <textarea
          id="input"
          rows="2"
          placeholder="Ask any question"
          required
        ></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </main>
    <script src="/static/marked.min.js?v=4"></script>
    <script src="/static/glossary.js?v=4"></script>
    <script src="/static/glossary_match.js?v=4"></script>
    <script src="/static/app.js?v=4"></script>
    <script src="/static/quiz.js?v=4"></script>
    <script src="/static/fastcheck.js?v=4"></script>
  </body>
</html>
